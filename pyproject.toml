[project]
name = "klaimkembar"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.2.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["klaimkembar"]
omit = ["klaimkembar/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["klaimkembar"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.vercel]
entrypoint = "klaimkembar.main:app"
